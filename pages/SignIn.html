</head>
<body>
    <header>

    <main>

        <section>
            <form action="" method="">

                <h2>Connectez-vous!</h2>



                <p>Ou utilisez vos identifiants</p>

                <fieldset>
                    <div>
                        <label for="email">E-mail :</label>
                        <input type="email" id="email" placeholder="Exemple@gmail.com" required>
                    </div>
                    <div>
                        <label for="pwd">Mot de passe :</label>
                        <input type="password" name="password" id="pwd" placeholder="Mot de passe" required>
                    </div>
                </fieldset>
                <button type="submit">Connexion</button>

                <a href="">Mot de passe oublié?</a>


                <p>Pas encore de compte? <a href="SignUp.html">Inscrivez-vous !</a></p>
            </form>
        </section>

    </main>

    <footer>

    </footer>
    
</body>
