<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>

            <div class="banner-left">
                <a href="../Index.html">Accueil</a>

                <a href="Recipe.html">Recette</a>

                <a href="Search.html">Recherche</a>

                <a href="contact.html">Contact</a>
            </div>

            <div class="banner-right">
                <i class="fa-solid fa-magnifying-glass"></i>

                <a href="SignIn.html">Sign In</a>

                <a href="SignIn.html"><button class="btn-cta">Sign Up</button></a>
            </div>

        </nav>
        
    </header>


    <main class="container-signIn">
        
        <section>
            <form action="" method="" class="form-signin">
                <div class="connect">
                    <h1>Connectez-vous!</h1>

                    <button type="button"><i class="fa-brands fa-square-facebook" id="fb"></i></button>
                    <button type="button"><i class="fa-brands fa-square-google-plus" id="google"></i></button>
                    <button type="button"><i class="fa-brands fa-square-linkedin" id="linkedIn"></i></button>
                    
                    <p>Ou utilisez vos identifiants</p>
                </div>

                <fieldset>
                    <div>
                        <label for="email">E-mail :</label>
                        <input type="email" id="email" placeholder="Exemple@gmail.com" required>
                    </div>
                    <div>
                        <label for="pwd">Mot de passe :</label>
                        <input type="password" name="password" id="pwd" placeholder="Mot de passe" required>
                    </div>
                </fieldset>

                <a href="">Mot de passe oublié?</a> <br>

                <button type="submit" id="call-back-btn">Connexion</button>
            </form>
        </section>

        <section class="redir-signup">

            <h2>Salut, rejoignez-nous</h2>

            <p>Entrez vos informations et rejoignez la communauté de cuisiniers</p>

            <button type="button">Inscrivez-vous</button>

        </section>

    </main>

    <footer>

    </footer>

</body>

</html>
